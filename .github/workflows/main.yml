name: Gerar APK Android (MULTILOG)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configurar Java 17 (Android Build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar Flet CLI
        run: |
          pip install --upgrade pip
          pip install "flet[all]>=0.24.0"

      - name: Compilar APK Android
        run: |
          if [ -d "Projeto_Android" ]; then
            cd Projeto_Android
          fi
          rm -rf .venv build
          cat << 'EOF' > pyproject.toml
          [project]
          name = "multilog-android"
          version = "1.0.0"
          description = "MULTILOG - Gestao Inteligente de Estoque Pick-to-Light para Android"
          requires-python = ">=3.10"
          dependencies = [
              "flet>=0.24.0"
          ]

          [tool.flet]
          org = "com.multilog"
          product = "MULTILOG Estoque"
          company = "MULTILOG"
          copyright = "Copyright (C) 2026 by MULTILOG"

          [tool.flet.app]
          path = "."
          exclude = [".venv", ".pytest_cache", "__pycache__", "build", "tests", "firmware_esp32_wifi"]

          [tool.flet.android]
          manifest_application = { usesCleartextTraffic = "true" }

          [tool.flet.android.permission]
          "android.permission.INTERNET" = true
          "android.permission.ACCESS_NETWORK_STATE" = true
          "android.permission.ACCESS_WIFI_STATE" = true

          [tool.flet.android.gradle_properties]
          "org.gradle.jvmargs" = "-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError"
          "android.useAndroidX" = "true"
          EOF
          flet build apk --yes

      - name: Publicar APK Gerado como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: multilog-android-apk
          path: |
            Projeto_Android/build/apk/*.apk
            build/apk/*.apk
